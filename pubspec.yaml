name: auto_moto_dash
description: >-
  Motorcycle/car dashboard Flutter package (EN/中文 docs): digital HUD,
  production-inspired analog/LCD clusters, weather backgrounds, inertial
  particle effects and a first-person 3D cockpit (flutter_scene / three.js).
version: 0.7.0
homepage: https://github.com/whevether/auto_moto_dash
repository: https://github.com/whevether/auto_moto_dash

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.1
  flutter_scene: ^0.24.3
  vector_math: ^2.1.4
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/weather_bg/
    - assets/web/
    - assets/web/three/
    - assets/web/three/addons/
    - assets/models/kenney_car_kit/
    - assets/models/kenney_car_kit/Textures/
    - assets/models/khronos_car_concept/
