name: auto_moto_dash
description: >-
  Motorcycle/car dashboard Flutter package (EN/中文 docs): digital HUD,
  production-inspired analog/LCD clusters, weather backgrounds, and inertial particle effects.
version: 0.5.0
homepage: https://github.com/whevether/auto_moto_dash
repository: https://github.com/whevether/auto_moto_dash

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/weather_bg/
